name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=TMDB_TOKEN=${{ secrets.TMDB_TOKEN }} --dart-define=ORACLE_URL=${{ secrets.ORACLE_URL }} --dart-define=SPORTS_URL=${{ secrets.SPORTS_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
