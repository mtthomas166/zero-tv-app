name: pstream_android
description: "Veil is a minimalist Android streaming client with a self-hosted resolver stack."
publish_to: 'none'
version: 3.1.1+30101

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  media_kit: ^1.1.11
  media_kit_video: ^1.0.5
  media_kit_libs_video: ^1.0.7
  better_player_plus: ^1.0.9
  cached_network_image: ^3.3.0
  go_router: ^14.6.3
  google_fonts: ^6.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shimmer: ^3.0.0
  flutter_riverpod: ^2.6.1
  flutter_inappwebview: ^6.1.5
  package_info_plus: ^10.2.1
  flutter_animate: ^4.5.0
  crypto: ^3.0.3
  open_filex: ^4.3.4
  http: ^1.2.2
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - logo.png
    - logo-circle.png
    - assets/logo1.png
    - assets/bg.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "logo-circle.png"
  adaptive_icon_background: "#0A0613"
  adaptive_icon_foreground: "logo-circle.png"
