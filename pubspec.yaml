name: pstream_android
description: "Veil is a minimalist Android streaming client with a self-hosted resolver stack."
publish_to: 'none'
version: 3.1.1+30101

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  better_player_plus: ^1.0.9
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_inappwebview: ^6.1.5
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - logo.png
    - logo-circle.png
    - assets/logo1.png
    - assets/bg.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "logo-circle.png"
  adaptive_icon_background: "#0A0613"
  adaptive_icon_foreground: "logo-circle.png"
